services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: locker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  # Backs the retrieval attempt limiter. `appendonly` so a restart does not
  # wipe every active lockout — the counters are a security control, and one
  # that forgets on demand is one an attacker can clear.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    # Published so host-run e2e can reach it. 6379 is a port developers often
    # already have a Redis on, and unlike 3306 that clash is common enough to
    # be worth a knob: set REDIS_HOST_PORT to move it. The api container is
    # unaffected either way — it reaches Redis over the compose network.
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:root@mysql:3306/locker
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      AUTH_DEV_TOKENS: 'true'
      CURRENCY: AUD
      # Secret mixed into pickup-code hashes. Required whenever NODE_ENV is
      # production, so the stack will not boot without it. A demo placeholder
      # like JWT_SECRET above — a real deployment supplies a real secret, and
      # changing it invalidates every outstanding pickup code.
      PICKUP_CODE_PEPPER: dev-pepper-change-me
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql-data:
  redis-data:
